name: Update formula

# Points Formula/plugview.rb and Casks/plugview.rb at the latest plugview release. Runs on a schedule so no cross-repository
# token is needed; run it by hand right after a release to publish immediately.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo plugview/plugview --json tagName --jq .tagName)"
          version="${tag#v}"
          checksum() {
            curl -fsSL "https://github.com/plugview/plugview/releases/download/$tag/$1.sha256" | cut -d ' ' -f 1
          }
          sha256="$(checksum plugview-macos-universal.tar.gz)"
          app_sha256="$(checksum plugview-macos-app.zip)"
          for value in "$sha256" "$app_sha256"; do
            if ! [[ "$value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::No valid checksum published for $tag"
              exit 1
            fi
          done
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "SHA256=$sha256" >> "$GITHUB_ENV"
          echo "APP_SHA256=$app_sha256" >> "$GITHUB_ENV"

      - name: Rewrite formula and cask
        run: |
          sed -i -E \
            -e "s|releases/download/v[^/]+/|releases/download/$TAG/|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
            Formula/plugview.rb
          sed -i -E \
            -e "s|^  version \".*\"|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"$APP_SHA256\"|" \
            Casks/plugview.rb
          git diff

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Formula already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "plugview $VERSION"
          git push
